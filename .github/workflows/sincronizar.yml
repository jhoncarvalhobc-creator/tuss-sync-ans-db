name: Sincronizar TUSS com a ANS

on:
  workflow_dispatch:
    inputs:
      tabela:
        description: 'Codigo da tabela na ANS (ex.: tuss-19)'
        required: true
      descricao:
        description: 'Descricao da tabela (opcional, so para o titulo/notas do release)'
        required: false
      filtro:
        description: 'Filtro de busca dentro da tabela (opcional)'
        required: false
      recomecar:
        description: 'Ignorar progresso salvo e comecar do zero (true/false)'
        required: false
        default: 'false'
  schedule:
    # a cada 5 horas, retoma automaticamente qualquer tabela ainda incompleta
    - cron: '0 */5 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: tuss-sync-ans-db-unica-execucao
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Disparo manual — sincroniza a tabela pedida
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TABELA: ${{ inputs.tabela }}
          IN_DESCRICAO: ${{ inputs.descricao }}
          IN_FILTRO: ${{ inputs.filtro }}
          IN_RECOMECAR: ${{ inputs.recomecar }}
        run: |
          python gerenciar_lista.py adicionar --tabela "$IN_TABELA" --descricao "$IN_DESCRICAO" --filtro "$IN_FILTRO"
          ARGS=(--tabela "$IN_TABELA" --tempo-max-s 19200)
          if [ -n "$IN_DESCRICAO" ]; then ARGS+=(--descricao "$IN_DESCRICAO"); fi
          if [ -n "$IN_FILTRO" ]; then ARGS+=(--filtro "$IN_FILTRO"); fi
          if [ "$IN_RECOMECAR" = "true" ]; then ARGS+=(--recomecar); fi
          python sync_ci.py "${ARGS[@]}"

      - name: Disparo agendado — retoma tabelas ainda incompletas
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python retomar_agendado.py

      - name: Salvar lista de tabelas ativas e histórico no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tabelas_ativas.json historico.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "atualiza progresso das sincronizações"
          git push || echo "nada para enviar ou push falhou (nao e fatal)"
